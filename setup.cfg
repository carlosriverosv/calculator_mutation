[coverage:run]
branch = True
omit = mutants/*

[mutmut]
source_paths = calculator.py
runner = pytest
pytest_add_cli_args_test_selection = tests/

[tool:pytest]
addopts = --cov=calculator --cov-report=term-missing
pythonpath = .
testpaths = tests
norecursedirs = .mutmut-cache mutmut_cache mutants mutates .git .venv
python_files = test_*.py *_test.py